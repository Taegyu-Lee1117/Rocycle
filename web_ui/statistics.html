<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>재활용로봇 처리 통계</title>
<style>
  :root{
    --bg:#0b0d10;--panel:#14171b;--panel-2:#1a1e23;
    --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
    --fg:#e7eaec;--fg-2:#98a0a8;--fg-3:#646c74;
    --ok:#3ddc97;--warn:#f0b429;--bad:#ef5f5f;--info:#5aa9ff;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg);color:var(--fg);font-family:"Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .app{min-height:100vh;padding:10px;display:grid;grid-template-rows:54px auto 1fr;gap:10px}
  .topbar{
    display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:8px;padding:0 16px;
  }
  .back{
    height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:6px;
    display:inline-flex;align-items:center;gap:7px;color:var(--fg-2);font-size:13px;
  }
  .back:hover{background:var(--panel-2);color:var(--fg)}
  .title{font-size:16px;font-weight:600}
  .spacer{flex:1}
  .source-badge{
    display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;
    border-radius:6px;background:rgba(90,169,255,.1);color:var(--info);font-size:12px;
  }
  .source-badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .clock{font-size:13px;color:var(--fg-2)}

  .toolbar{
    display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:8px;padding:10px 14px;
  }
  .toolbar-label{font-size:12px;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase}
  .periods{display:flex;gap:6px}
  .period-btn{
    min-width:70px;height:32px;border:1px solid var(--line-2);border-radius:6px;
    background:transparent;color:var(--fg-2);font-size:13px;
  }
  .period-btn:hover{background:var(--panel-2);color:var(--fg)}
  .period-btn.active{border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.1);color:var(--ok)}
  .range{margin-left:auto;font-size:12px;color:var(--fg-3)}

  .content{min-height:0;display:grid;grid-template-rows:auto minmax(330px,1fr);gap:10px}
  .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .summary-card,.chart-card{background:var(--panel);border-radius:8px;border:1px solid var(--line)}
  .summary-card{padding:14px 16px}
  .summary-label{font-size:12px;color:var(--fg-3);letter-spacing:.04em}
  .summary-value{margin-top:6px;font-size:27px;font-weight:600;line-height:1}
  .summary-note{margin-top:7px;font-size:11.5px;color:var(--fg-3)}
  .summary-card.pending .summary-value{color:var(--warn)}
  .summary-card.success .summary-value{color:var(--ok)}
  .summary-card.manual .summary-value{color:var(--info)}

  .charts{min-height:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,1fr);gap:10px}
  .chart-card{padding:15px 16px;min-height:0}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .card-head h2{font-size:14px;font-weight:600}
  .card-head p{margin-top:4px;font-size:11.5px;color:var(--fg-3)}
  .card-total{font-size:12px;color:var(--fg-2)}

  .bar-chart{
    height:calc(100% - 54px);min-height:250px;display:flex;align-items:stretch;
    padding:12px 4px 0;border-bottom:1px solid var(--line-2);
    background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(25% - 1px),var(--line) 25%);
  }
  .bar-slot{flex:1;min-width:38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}
  .bar-value{font-size:11px;color:var(--fg-2)}
  .bar-column{width:min(54%,54px);min-height:3px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#58e4a7,#23895f);transition:height .25s ease}
  .bar-label{height:22px;font-size:11px;color:var(--fg-3);white-space:nowrap}

  .distribution{height:calc(100% - 54px);min-height:250px;display:grid;grid-template-columns:minmax(150px,.9fr) minmax(190px,1.1fr);align-items:center;gap:18px}
  .donut-wrap{display:grid;place-items:center}
  .donut{width:min(220px,17vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}
  .donut::after{content:"";position:absolute;width:61%;height:61%;border-radius:50%;background:var(--panel)}
  .donut-center{position:relative;z-index:1;text-align:center}
  .donut-center strong{display:block;font-size:25px}
  .donut-center span{font-size:11px;color:var(--fg-3)}
  .legend{display:grid;gap:9px}
  .legend-row{display:grid;grid-template-columns:9px minmax(90px,1fr) 42px 42px;align-items:center;gap:8px;font-size:12px}
  .legend-dot{width:8px;height:8px;border-radius:2px}
  .legend-name{color:var(--fg-2)}
  .legend-count{text-align:right;color:var(--fg)}
  .legend-percent{text-align:right;color:var(--fg-3)}
  .api-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--fg-3);font-size:14px;line-height:1.7}

  @media (max-width:1100px){
    .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
    .charts{grid-template-columns:1fr}
    .bar-chart{height:300px}
    .distribution{height:auto;min-height:300px}
    .donut{width:190px}
  }
  @media (max-width:560px){
    .app{padding:6px;gap:6px}
    .topbar{padding:0 10px;gap:9px}
    .title{font-size:14px}
    .source-badge,.clock{display:none}
    .toolbar{align-items:flex-start;flex-wrap:wrap}
    .range{width:100%;margin-left:0}
    .summary{gap:6px}
    .summary-card{padding:12px}
    .summary-value{font-size:23px}
    .charts{gap:6px}
    .chart-card{padding:13px 12px}
    .distribution{grid-template-columns:1fr}
    .legend{width:100%}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backLink" href="./">← 관제 화면</a>
    <h1 class="title">관리자 처리 통계</h1>
    <div class="spacer"></div>
    <span class="source-badge" id="sourceBadge"><i></i><span>DB 연결 전</span></span>
    <span class="clock mono" id="clockText">--:--:--</span>
  </header>

  <section class="toolbar" aria-label="통계 기간 선택">
    <span class="toolbar-label">조회 기간</span>
    <div class="periods">
      <button class="period-btn active" data-period="day">일</button>
      <button class="period-btn" data-period="week">주</button>
      <button class="period-btn" data-period="month">월</button>
    </div>
    <span class="range num" id="rangeText"></span>
  </section>

  <main class="content">
    <section class="summary" aria-label="처리 요약">
      <article class="summary-card success">
        <p class="summary-label">완료 처리</p>
        <p class="summary-value num" id="completedValue">0건</p>
        <p class="summary-note" id="completedNote">최종 완료 기준</p>
      </article>
      <article class="summary-card pending">
        <p class="summary-label">검토 대기</p>
        <p class="summary-value num" id="pendingValue">0건</p>
        <p class="summary-note">완료 통계에서 제외</p>
      </article>
      <article class="summary-card">
        <p class="summary-label">처리 성공률</p>
        <p class="summary-value num" id="successRateValue">0%</p>
        <p class="summary-note" id="failureNote">실패 0건</p>
      </article>
      <article class="summary-card manual">
        <p class="summary-label">작업자 확인 처리</p>
        <p class="summary-value num" id="manualValue">0건</p>
        <p class="summary-note">검토 후 완료된 품목</p>
      </article>
    </section>

    <section class="charts">
      <article class="chart-card">
        <div class="card-head">
          <div><h2 id="timelineTitle">시간대별 처리량</h2><p>최종 처리 완료 시각 기준</p></div>
          <span class="card-total num" id="timelineTotal">합계 0건</span>
        </div>
        <div class="bar-chart" id="barChart" aria-label="기간별 처리량 막대그래프"></div>
      </article>

      <article class="chart-card">
        <div class="card-head">
          <div><h2>클래스별 비율</h2><p>작업자가 수정한 최종 클래스 반영</p></div>
        </div>
        <div class="distribution" id="distribution">
          <div class="donut-wrap">
            <div class="donut" id="donutChart" aria-label="클래스별 처리 비율 원그래프">
              <div class="donut-center"><strong class="num" id="donutTotal">0</strong><span>완료 건</span></div>
            </div>
          </div>
          <div class="legend" id="classLegend"></div>
        </div>
      </article>
    </section>
  </main>
</div>

<script>
(function(){
  "use strict";
  const qs = new URLSearchParams(location.search);
  const DEMO_MODE = qs.get("demo") === "1";
  const API_BASE = (qs.get("api_base") || "").replace(/\/$/, "");
  const el = (id) => document.getElementById(id);
  const CLASS_COLORS = {
    battery:"#9d7df2",can:"#78d5a3",paper:"#68b7e8",
    pet_labeled:"#5aa9ff",plastic:"#f0b429",plastic_bag:"#ef7f96",
  };
  const MOCK = {
    day:{
      range:"오늘 · 2026.09.09",completed:37,pending:6,failed:2,manual:4,
      timelineTitle:"시간대별 처리량",labels:["08시","10시","12시","14시","16시","18시"],values:[3,7,5,10,8,4],
      classes:{battery:5,can:9,paper:6,pet_labeled:4,plastic:8,plastic_bag:5},
    },
    week:{
      range:"이번 주 · 09.07–09.13",completed:130,pending:6,failed:5,manual:13,
      timelineTitle:"요일별 처리량",labels:["월","화","수","목","금","토","일"],values:[18,22,15,27,25,14,9],
      classes:{battery:17,can:31,paper:22,pet_labeled:14,plastic:29,plastic_bag:17},
    },
    month:{
      range:"이번 달 · 2026년 9월",completed:340,pending:6,failed:11,manual:32,
      timelineTitle:"주차별 처리량",labels:["1주","2주","3주","4주"],values:[72,88,96,84],
      classes:{battery:48,can:79,paper:55,pet_labeled:36,plastic:76,plastic_bag:46},
    },
  };

  if(DEMO_MODE){
    el("sourceBadge").querySelector("span").textContent="데모 데이터";
    el("backLink").href="./?demo=1&layout=review";
    document.title="[데모] "+document.title;
  }

  function tickClock(){
    const d=new Date();
    const pad=(n)=>String(n).padStart(2,"0");
    el("clockText").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tickClock();setInterval(tickClock,1000);

  async function render(period){
    document.querySelectorAll(".period-btn").forEach((button)=>{
      button.classList.toggle("active",button.dataset.period===period);
    });
    if(DEMO_MODE){renderData(MOCK[period]);return;}
    try{
      const response=await fetch(`${API_BASE}/api/statistics?period=${period}`,{cache:"no-store"});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const data=await response.json();
      el("sourceBadge").querySelector("span").textContent="PostgreSQL";
      renderData(data);
    }catch(error){
      el("sourceBadge").querySelector("span").textContent="DB 연결 오류";
      console.error("[DB API] statistics failed",error);
      renderEmpty();
    }
  }

  function renderData(data){
    const attempts=data.completed+data.failed;
    const successRate=attempts===0?0:(data.completed/attempts)*100;
    el("rangeText").textContent=data.range;
    el("completedValue").textContent=`${data.completed}건`;
    el("pendingValue").textContent=`${data.pending}건`;
    el("successRateValue").textContent=`${successRate.toFixed(1)}%`;
    el("failureNote").textContent=`실패 ${data.failed}건`;
    el("manualValue").textContent=`${data.manual}건`;
    el("timelineTitle").textContent=data.timelineTitle;
    el("timelineTotal").textContent=`합계 ${data.completed}건`;
    renderBars(data.labels,data.values);
    renderDistribution(data.classes);
  }

  function renderEmpty(){
    el("rangeText").textContent="DB API 연결 후 조회 가능";
    ["completedValue","pendingValue","manualValue"].forEach((id)=>el(id).textContent="--");
    el("successRateValue").textContent="--";
    el("failureNote").textContent="실패 기록 조회 전";
    el("timelineTotal").textContent="합계 --";
    el("barChart").innerHTML='<p class="api-empty">DB 통계 API 연결 후<br>기간별 처리량이 표시됩니다.</p>';
    el("distribution").innerHTML='<p class="api-empty">DB 통계 API 연결 후<br>클래스별 비율이 표시됩니다.</p>';
  }

  function renderBars(labels,values){
    const chart=el("barChart");chart.innerHTML="";
    const max=Math.max(1,...values);
    values.forEach((value,index)=>{
      const slot=document.createElement("div");slot.className="bar-slot";
      const number=document.createElement("span");number.className="bar-value num";number.textContent=value;
      const bar=document.createElement("div");bar.className="bar-column";bar.style.height=`${Math.max(3,(value/max)*82)}%`;
      const label=document.createElement("span");label.className="bar-label";label.textContent=labels[index];
      slot.append(number,bar,label);chart.appendChild(slot);
    });
  }

  function renderDistribution(classes){
    const entries=Object.entries(classes);const total=entries.reduce((sum,[,value])=>sum+value,0);
    let cursor=0;const segments=[];
    for(const [name,value] of entries){
      const start=cursor;cursor+=total===0?0:(value/total)*100;
      segments.push(`${CLASS_COLORS[name]} ${start}% ${cursor}%`);
    }
    el("donutChart").style.background=`conic-gradient(${segments.join(",")})`;
    el("donutTotal").textContent=total;
    const legend=el("classLegend");legend.innerHTML="";
    for(const [name,value] of entries){
      const row=document.createElement("div");row.className="legend-row";
      const dot=document.createElement("i");dot.className="legend-dot";dot.style.background=CLASS_COLORS[name];
      const label=document.createElement("span");label.className="legend-name";label.textContent=name;
      const count=document.createElement("span");count.className="legend-count num";count.textContent=`${value}건`;
      const percent=document.createElement("span");percent.className="legend-percent num";percent.textContent=`${total?((value/total)*100).toFixed(0):0}%`;
      row.append(dot,label,count,percent);legend.appendChild(row);
    }
  }

  document.querySelectorAll(".period-btn").forEach((button)=>{
    button.addEventListener("click",()=>render(button.dataset.period));
  });
  render("day");
})();
</script>
</body>
</html>
