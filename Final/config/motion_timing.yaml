# 예측 시점 계산에 쓰는 이동/하강 시간 상수 — 6일차 실측(빠른 속도,
# v44 작업A 결과, vel=120/40 수평·vel=100/40 수직 기준).
#
# [전제] travel_time_sec는 HOME<->벨트 상공 기준값을 임시로 쓴다 —
# 실제로는 로봇이 "어디서 출발하느냐"(직전 통 위치)에 따라 이동
# 거리·시간이 다르다(v41 3-2절 지적). 상태머신에 통합할 때는 이
# 하나의 상수 대신 (현재 위치 -> 목표 벨트 지점) 쌍마다 값을
# 따로 두거나, 매번 실시간으로 계산해야 한다.
#
# predict_ahead_sec(item) = travel_time_sec + descent_time_sec
#                            + gripper_profiles[item].close_wait_sec

motion_timing:
  # [실측 — 6일차, 속도 상향 테스트] 연속파지 사이클타임 단축 목적으로
  # 수평 120->150(vel)/40->50(acc), 수직 100->130(vel)/40->50(acc)로
  # 상향 후 물체 없이 재측정 -- SAFE_OFF/특이점 알람 없음(robot_state
  # 계속 정상), travel 3.410->2.999s(-12%), descent 2.194->1.882s
  # (-14%). **[정정] 절감폭이 크지 않다** -- confirmed~완료 구간의
  # 지배적 비중은 확정 지연(6~9초, CPU 추론 속도에 묶임)이라 이
  # 정도 속도 상향만으로는 목표(10초)에 크게 못 미친다. 이후 페트병
  # 핸드오버 실물 1회로 예측 정확도(파지 위치)까지 재검증.
  travel_time_sec: 2.999   # [실측 — 6일차] HOME<->벨트 상공, vel=150/acc=50
  descent_time_sec: 1.882  # [실측 — 6일차] 100mm 하강, vel=130/acc=50

  # 벨트 상공 호버 포즈(x는 매 파지마다 예측값으로 갱신, y/z/자세는
  # 상수 — CLAUDE.md "자기 정렬" 설계 근거 참고). [원문] 6일차
  # measure_cycle_time_fast.py에서 실사용한 값.
  belt_hover_y: -264.0
  belt_hover_z: 430.0
  belt_hover_rx: 179.78
  belt_hover_ry: 176.40
  belt_hover_rz: 89.78
  horizontal_vel: 150.0
  horizontal_acc: 50.0
  vertical_vel: 130.0
  vertical_acc: 50.0

  # [실측 — 4일차] x>590mm는 표준 자세(ry~176-180)로 도달 불가,
  # 손목 기울임이 필요(재탐색은 오늘 범위 밖, CLAUDE.md "현재 단계"
  # 7번 참고). **[버그 발견 — 6일차, 핸드오버 2차 시도]** 이 값을
  # 코드가 몰라서 예측 x가 이미 590mm를 넘겼는데도 매 프레임
  # MoveLine을 보내고 NOT REACHABLE로 실패-재시도를 20회 넘게
  # 반복(벨트가 안 멈추니 물체가 계속 더 밀려나가 상황이 악화됨) --
  # `_execute_pick`에서 이 값을 넘으면 MoveLine 자체를 시도하지
  # 않고 즉시 중단하도록 사전 체크 추가.
  max_reachable_x: 590.0

  # [완료 — 6일차, 순차 처리 인덱싱] 배치 완료 후 복귀할 기본 x —
  # 남아있는 추적 트랙이 있으면 그중 가장 앞선(x가 가장 큰) 물체
  # 쪽으로 복귀하지만(다음 Pick 대상에 더 가까운 곳에서 대기), 남은
  # 트랙이 없을 때만 이 값을 쓴다. 벨트 시작쪽 근처 값.
  default_return_x: 300.0
