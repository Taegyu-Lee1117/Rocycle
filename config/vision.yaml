# YOLO12s 검출 설정 — 원칙3(외부화) 준수, 판정 로직에 하드코딩 금지.
#
# [팀결정 — v47 회신] conf=0.6로 확정. 미학습 물체(휴지심) 오검출은
# conf 0.28~0.30, 정상 검출은 0.93 이상으로 나와 여유가 크다(6일차
# dry-run 실측, 실측기록.md 참고). 0.7도 안전하나 0.6으로 시작.
#
# model_path는 패키지 상대 경로 — setup.py의 data_files로 설치됨.
vision:
  model_path: "models/yolo12s_best.pt"
  conf: 0.6
  iou: 0.7
  imgsz: 640
  # [팀결정 — v47 회신] pet_labeled/pet_unlabeled 고신뢰도 오분류
  # (무라벨 페트병이 0.94로 pet_labeled 오분류)는 conf로 못 거른다 —
  # 알려진 한계로 받아들이고 시연 구성에서 무라벨 페트병을 제외한다
  # (재학습은 시간이 없고, 후처리 보정은 원칙6 위반 소지 있음).
  # 상세: CLAUDE.md "현재 단계" v45/v47 항목.
  known_limitation_note: >
    C270은 depth가 없어 무라벨 투명체 검출이 원리적으로 제한됨(v25).
    이번 오분류는 그 예측이 실측으로 확인된 사례.

  # Pick 트리거 게이팅 (통합 프롬프트 8~9번 요구사항, 상태머신
  # 골격이 아직 없어 tracking_node 레벨에서 최소 구현) — [전제],
  # 실물 통합 시 값 조정 필요.
  # [정정 — 6일차, 벨트 이동 1차 시도 실패 후] 3프레임(~2초, CPU
  # ~1fps 기준)은 칼만필터 속도 추정 기준선(baseline)으로 너무
  # 짧았다 — can 1차 시도에서 vx가 0.00→3.92→2.00mm/s로 크게
  # 흔들렸고, 이 상태로 7.6초(이동+하강+닫힘) 앞을 예측하니 오차가
  # 증폭돼 캔 뒤쪽(트레일링 엣지)을 잡아 파지 실패(밀려 떨어짐).
  # 5프레임(~4~5초)으로 늘려 속도 추정 안정성 확보 시도.
  #
  # [정정 — 6일차, 건전지 실패 후] "물체가 가속 중이라 속도를 낮게
  # 본다"는 가설은 실측 vx 로그(성공/실패 사례 모두 꾸준한 증가가
  # 아니라 노이즈성 진동)로 기각[사용자 지적, 타당함] — 벨트
  # 자체는 스테퍼 구동이라 가속도가 거의 0이라는 점과도 일치한다.
  # **정정된 진단**: 짧은 관측 구간(1fps 기준 몇 초) + 검출 픽셀
  # 노이즈로 순간 속도 추정 자체가 불안정한 것 — 가속 여부와
  # 무관한 문제. 대응: 관측 프레임을 7로 늘려 평균화 구간 확보.
  # [정정 — 6일차, 건전지 재시도 후] 7프레임으로도 여전히 조금
  # 못 미침(하부만 건드림, 완전 실패보단 개선) — 9로 한 번 더
  # 확대 + 건전지 전용 prediction_bias_mm(gripper_profiles.yaml)
  # 병행 적용.
  min_consecutive_frames: 9   # 동일 클래스 연속 확인 최소 프레임 수
  object_lost_frames: 5       # 이 프레임 수만큼 미검출이면 객체 잠금 해제

  # [완료 — 6일차, 순차 처리 인덱싱] 기존엔 max_det=1(팀 원안, "한
  # 번에 물체 하나만 투입" 전제)이라 프레임당 최고-신뢰도 물체 하나만
  # 봤다 -- 순차 캔+건전지 테스트에서 confidence가 낮은 물체(건전지)
  # 가 화면에 있어도 아예 안 잡히는 문제 확인(CLAUDE.md "현재 단계"
  # 10번). detect_all()로 여러 물체를 동시에 추적하고, Pick 우선순위는
  # 신뢰도가 아니라 벨트 진행방향(x가 가장 큰, 도달범위에 가장 먼저
  # 걸릴 물체)으로 정한다.
  max_det: 3
  # 물체별 트랙을 프레임 간 매칭할 때 쓰는 허용 오차(mm). 파지
  # 사이클 중(confirmed~완료, 최대 ~24초) tracking_node의 이미지
  # 콜백 자체가 완전히 블로킹돼 그동안 다른 물체는 갱신이 안 되는데
  # (single-threaded executor), 블로킹이 끝난 뒤 재매칭할 때 그
  # 시간만큼 벨트가 이동한 거리를 커버해야 하므로 일반적인 프레임
  # 간 이동거리보다 훨씬 넉넉하게 잡는다. [전제] 미세조정 전 값 --
  # 벨트 속도(2cm/s)*최대 블로킹 시간(~24s)=약 480mm까지 밀릴 수
  # 있어 여유있게 잡는다 -- 실측 후 조정할 것. 매칭 실패의 대가는
  # 안전 문제가 아니라 "그 트랙의 pending_count가 초기화되는 것"
  # 뿐이라 다소 넉넉하게 잡는 쪽이 안전하다(같은 클래스 물체가
  # 동시에 2개 이상 있는 경우엔 오매칭 위험이 있지만, 오늘 테스트
  # 시나리오(캔+건전지, 서로 다른 클래스)에서는 클래스 필터링으로
  # 방지됨).
  track_match_gate_mm: 500.0

  # [안전 — 6일차, 로봇 연결 전 추가] 현재 카메라 프레이밍에 벨트뿐
  # 아니라 통(bin)들도 함께 잡힌다(README는 "벨트 ROI 불필요"라고
  # 하지만 그건 통이 카메라 시야 밖인 최종 배치 전제 — 지금은 아직
  # 그렇지 않음). anchor_pixel의 v(세로)가 이 값보다 작으면(=통
  # 쪽 영역) 실제 로봇 실행을 하지 않는다 — [전제, 눈대중] 현재
  # 카메라 구도 기준.
  belt_pixel_y_min: 470
