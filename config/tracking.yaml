# tracking_node 설정 — 3일차 실측 반영
# 설계문서 재활용로봇_설계문서_v27.txt 13절 작업 순서 참고

# [수정 -- 9일차] 최상위 키가 `tracking_node`였는데 실제 실행 노드는
# `tracking_pick_node`다. ROS2 params 파일은 노드 이름이 정확히
# 일치할 때만 적용되므로 **이 파일의 파라미터가 전혀 적용되지 않고
# 있었다** -- 캘리브레이션(cam_to_base/belt_plane)이 기본값(빈 값/0)인
# 채로 떠서 `calibration ready=False`, pixel_to_base가 전부 실패했다.
# 로봇은 좌표 계산 단계에서 막혀 움직이지 않았으므로 사고는 없었다.
tracking_pick_node:
  ros__parameters:
    camera.fx: 1427.528173
    camera.fy: 1429.801911
    camera.cx: 674.333213
    camera.cy: 359.179031
    camera.dist_coeffs: [0.083788, -0.006721, -0.005860, 0.007959, 0.0]

    # 작업 C 결과 (3일차, 12샘플 hand-eye calibration — 1차 9샘플은
    # 회전 다양성 부족(4도)으로 실패, 재작업하여 통과. 설계문서
    # v29 13절 참고)
    # [정정 — 6일차, v61 회신] 특정 계정의 홈 디렉터리가 박힌
    # 절대경로였던 걸 패키지 상대경로로 변경 — 관제 PC 등 다른
    # 계정/경로로 옮겨도 그대로 동작한다. 반드시 T_cam2base.npy만
    # 쓸 것 — 같은 폴더의 _suspect 접미사 파일들은 실패작이다
    # (캘리브레이션_안내.md 참고).
    # [9일차] 이 상대경로를 해석하는 코드가 tracking_pick_node에
    # 없어서 실제로는 동작하지 않았다 -- _load_cam_to_base에 패키지
    # share 기준 해석을 추가했다.
    camera.cam_to_base_path: "calib_capture/T_cam2base.npy"

    # 작업 B 결과 (3일차, 5점 수동 티칭, 잔차 최대 0.33mm)
    belt_plane.abcd: [-0.003466, 0.005640, 0.999978, -316.7869]

    # ================================================================
    # [9일차 야간, v154] **칼만 vx 클램프를 실측 벨트 속도로 좁힌다.**
    # ================================================================
    # 490캔 하나를 dry_run으로 109초 흘려보내며 노드 자체 좌표(kf_x)로
    # 측정한 결과:
    #   - 이동 구간(0~64.7초) 최소자승 회귀 **4.984 mm/s**,
    #     잔차 표준편차 1.04mm (선형성 양호)
    #   - 10초 구간별 4.67 / 4.76 / 5.06 / 4.77 / 5.13 / 5.21 mm/s
    #     -- 벨트는 정속이다
    #
    # **_predict_x docstring의 "참값 3.06mm/s / 실측 3.18mm/s"는
    # 오류다.** 64.7초에 도달한계 홀드로 벨트가 멈춘 뒤의 44초까지
    # 포함해 전체 109초로 회귀하면 정확히 3.168 mm/s가 나온다.
    # 이전 측정이 정지 구간을 포함한 채 계산돼 36% 낮았던 것이다.
    #
    # 같은 구간 칼만 vx 분포(n=470): 최소 -9.23 / 25% 0.54 /
    # 중앙 3.95 / 75% 6.00 / 최대 24.08. 참값 대비 중앙값 -1.03,
    # 폭 -9~+24 -- 확정 시점(약 1초 관측)에 어떤 값이 잡히느냐가
    # 운이다. 실제 두 사이클에서 이렇게 갈렸다:
    #   355캔  vx=5.15  ahead=11.46s  예측 59.1 참값 57.1  ->  +2mm
    #   490캔  vx=2.27  ahead= 9.79s  예측 22.2 참값 48.8  -> -27mm
    # -27mm이 사용자가 지적한 "화면 좌측 쏠림"이다.
    #
    # 4.6~5.3은 10초 구간별 실측 범위(4.67~5.21)를 감싸는 폭이다.
    # 이 범위 안이면 12초 외삽에서도 오차가 8mm 이내다.
    #
    # **[주의] 이 변경은 모든 품목의 예측 이동량을 평균 약 10mm
    # 늘린다.** gripper_profiles.yaml의 prediction_bias_mm
    # (battery 30 / plastic 20 / paper 40)은 전부 낮게 추정되던 vx를
    # 전제로 맞춘 값이므로, 7종 전부 재검증하고 필요하면 그만큼
    # 낮춰야 한다. can은 bias 0에서 +2/-27mm이었으므로 클램프만으로
    # 약 +4mm에 수렴한다 -- bias 조정 불필요.
    kalman.vx_min_mm_s: 4.6
    kalman.vx_max_mm_s: 5.3
