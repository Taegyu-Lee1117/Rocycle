# 그리퍼 파지력/대기시간/사전폭 프로파일 — 4일차 실측 기반, v41 갱신.
#
# [팀결정 — v40] 파지력 설정은 세션 내내 유지되고 자동 리셋되지
# 않는다는 게 실측으로 확인됨(4일차) — 이전 값이 무엇이든 상관
# 없도록 매 파지 직전 이 표에서 해당 품목 값을 조회해 명시적으로
# 적용할 것. force_n이 null이면 그리퍼 기본값(RG2 max_force,
# 약 40N)을 그대로 쓴다는 뜻 — "설정을 안 한다"가 아니라 "기본값을
# 명시적으로 선택한다"로 취급할 것(SetCommand 'i'/'d' 호출 없이
# 그냥 'c'만 보내면 됨).
#
# close_wait_sec: onrobot_rg_control의 SetCommand 'c'는 비동기다
# (물리적으로 다 닫히기 전에 반환됨, 4일차 실측). 이 시간만큼
# 대기한 뒤에 다음 로봇 동작(특히 상승)을 시작할 것. [실측] 낮춘
# 힘(5N)은 기본값보다 닫히는 속도가 느려 대기시간이 더 필요함.
#
# [신규 — v41] pre_close_width_mm: 하강 전에 그리퍼를 이 폭까지
# 미리 좁혀두면 실제 파지 시 닫히는 거리(=시간)가 줄어든다.
# 벨트가 움직이는 상황에서는 close_wait_sec 동안 물체가 X축으로
# 계속 이동하는데, 그리퍼는 Y축으로만 닫히므로 이 지연은 자기
# 정렬로 흡수되지 않고 "물체가 손가락 접촉면 밖으로 빠져나가는"
# 실패로 이어질 수 있다는 게 v41 지적 — 아직 전부 [전제]/null,
# 실측 후 채울 것. 기준[추론]: 물체 폭 + 20~30mm(자기 정렬 여유는
# 남기되 닫힘 거리는 최소화).
#
# [실측 — 5일차, OnRobot RG2 User_Manual.pdf 78~79페이지] Total
# stroke 0~110mm, 파지력 조정범위 3~40N(저희가 쓴 5/10/40N 전부
# 유효 범위 안). **핑거팁 러버 패드의 X방향(닫힘축과 수직) 접촉
# 길이는 매뉴얼에 수치로 없음** — 80페이지 도면은 금속 브라켓
# 치수(마운팅홀 포함)라 러버 팁 자체 치수가 아니었다. **[팀결정
# — 5일차] 추가 실측 없이 스펙시트에서 확인된 객관적 정보만으로
# 진행한다 — 이 값은 [미확인]으로 남기고 더 파지 않는다.**
#
# [중요 발견 — 5일차] 79페이지: "긴 물체를 잡으면 안전스위치가
# 의도치 않게 작동할 수 있다"는 경고 + 파지폭(w)-허용 물체높이(h,
# 핑거팁 끝 기준) 한계 그래프. **그래프 눈대중 판독값[추론,
# 정밀 수치 아님]:**
#   w≈0~10mm  : h≈65~68mm (최대)
#   w≈20mm    : h≈50mm (급격히 하락)
#   w≈30~50mm : h≈48~49mm (완만한 구간)
#   w≈60mm    : h≈46mm
#   w≈80mm    : h≈42mm
#   w≈100mm   : h≈37~38mm
# **[추론] 이번 세션 반복된 SAFE 트립("과도한 깊이"든 "비대칭
# 접촉"이든)이 이 폭-높이 안전스위치 조건 하나로 통합 설명될
# 가능성이 높음.** 품목별 실제 파지 폭이 이 곡선 기준 허용
# 높이보다 큰 물체를 잡으면(=핑거팁 끝 기준 물체가 너무 길게
# 남으면) 트립 위험 — 다음 파지 시퀀스 설계에서 참고할 것.
#
# [실측 완료 — 5일차] vinyl(plastic_bag) 기본값(40N) 파지 확인 완료.

gripper:
  can:
    force_n: 10
    close_wait_sec: 2.0
    pre_close_width_mm: null   # [전제 — v41] 캔 지름 기준 실측 필요
    pick_depth_mm: 100         # [실측] 호버(z=430) 기준 하강량
    note: "[팀결정 — 5일차] 5N은 닫힘이 너무 느려 10N으로 상향 —
      약간의 찌그러짐은 감수하기로 결정(속도 우선). wait은 2.0초 유지."
    grasp_fail_joint_rad: 0.4638
      # [실측 -- 8일차] 빈 캔 파지 +0.1780 rad. 실패값 +0.7496과 중간.
  paper:
    force_n: 10
    close_wait_sec: 2.0
    pre_close_width_mm: null
    pick_depth_mm: 120   # [사용자 지시 — 9일차] 110 -> 120. 무정지
                         # 시험에서 종이 파지 실패, "추가로 10mm 하강
                         # 필요". (8일차에 100 -> 110으로 이미 올렸고
                         # 그때 근거가 "battery와 동일한 깊이"였는데,
                         # battery도 110이라 이번 +10으로 종이가 더
                         # 깊어진다 -- 9일차 지시의 "건전지와 동일"은
                         # 이미 충족돼 있던 상태였다.)
    note: "[팀결정 — 5일차] can과 동일 사유로 10N으로 상향. 종이는
      찌그러짐 허용치가 캔과 다를 수 있어 다음 실측 시 확인 필요."
    grasp_fail_joint_rad: 0.5623
      # [실측 -- 8일차] 종이 파지 +0.3749 rad(2회 재현, 편차 0.007).
      # 종이박스는 -0.0336으로 훨씬 두꺼움 -- 얇은 쪽 기준으로 잡았다.
  battery:
    force_n: null
    close_wait_sec: 1.0
    pre_close_width_mm: null
    pick_depth_mm: 110   # [실측 — 4일차] AA, 벨트 레일 Y=-264 기준
    prediction_bias_mm: 30.0   # [전제 — 6일차, 속도 상향 후 재조정]
      # under-prediction 완화용 보정, can/paper 등 다른 품목엔 적용
      # 안 함(건전지만 반복 실패, 허용오차 반지름 7mm로 작아 민감).
      # 근본 원인(검출 노이즈) 해결은 아니고 국소 완화책 — 실측기록.md
      # 6일차 참고. **[정정] 5.0mm(구 속도 기준)로는 새 속도(travel
      # 2.999s/descent 1.882s) 조건에서 부족(하부만 건드림, 사용자
      # 실측 지적) -- 30.0mm로 상향, 재검증 필요.
    note: "[실측] 기본값으로 변형 없이 파지 성공. [해소 — 5일차]
      battery_bin 관절 특이점 우려는 재현 실패로 기각됨(전체 경로
      재현 매끄러움 확인) — 기울임 불필요, 원래 좌표 그대로 확정."
    grasp_fail_joint_rad: 0.6864
      # [실측 -- 8일차] 건전지 파지 +0.6232 rad. **여유 0.063rad로 가장 좁다**
      # -- 원통이라 물리는 각도에 따라 실효 폭이 14mm(지름)~50mm(길이)로
      # 변할 수 있는데 눕힌 자세 1회만 쟀다. 2단계(동작 변경) 적용 전
      # 실사이클 표본으로 반드시 재검증할 것(v118 조건).
  pet_labeled:
    force_n: null
    close_wait_sec: 1.0
    pre_close_width_mm: null
    pick_depth_mm: 100
    note: "[전제] pet_unlabeled와 동일 재질 — 별도 실측 없이 추정"
    grasp_fail_joint_rad: null
      # [정정 -- 9일차, v141] 0.5089 -> null(판정 제외).
      # **종이·종이박스가 pet_labeled로 오분류되는데**(같은 물체가
      # 프레임마다 paper 0.56~0.67 / pet_labeled 0.50~0.83을 오가고
      # pet_labeled가 먼저 9프레임을 채워 확정된다), 종이를 실제로
      # 물고 있는 값 +0.6038/+0.6057이 페트병 기준 임계값 0.5089를
      # 넘어 **정상 파지가 실패로 판정**됐다. 2단계(실패 시 즉시 복귀)와
      # 겹치면 물고 있던 물체를 놓게 된다(실물로 발생).
      # 페트병 파지 판정을 포기하는 대신 잘못된 실패 판정을 없앤다.
      # [실측 -- 8일차] 페트병 파지 +0.2682 rad.
  pet_unlabeled:
    force_n: 10
    close_wait_sec: 2.0
    pre_close_width_mm: null
    pick_depth_mm: 110
      # [9일차] 100 -> 108. **무라벨 페트병 기준이 아니라 컵 뚜껑
      # 기준이다** -- v5 배포 중에는 뚜껑이 pet_unlabeled로 검출된다.
      # v6로 바꾸면 뚜껑은 plastic 프로파일을 타므로 죽은 값이 된다.
      # 시연에 무라벨 페트병을 쓰지 않는 정책(9일차) 하에서만 안전.
    prediction_bias_mm: 40.0
      # [실측 -- 9일차] 30.0으로 파지 성공(joint +0.0470) 후 사용자
      # 지시로 +10 추가 -> 40.0.
      # [9일차, 사용자 육안] 컵 뚜껑 파지 2회 연속 실패. 깊이를
      # 108mm로 올린 뒤에도 "위치가 잘못 갔다", "배터리와 마찬가지로
      # 캠 상 오른쪽 보정 필요"(사용자). 카메라 오른쪽 = base X 증가
      # (픽셀 x 73->263 이 X 167.7->262.9 로 매핑됨)이므로 양수.
      # **주의: 예측 지연 보정이 아니라 공간 오프셋 보정이다.**
      # 실패 당시 물체는 정지 상태(kf_vx 0.1~0.3mm/s)라 예측이 더한
      # 거리가 사실상 0이었다. 필드 이름과 실제 용도가 다르므로
      # 나중에 정리할 것. 30.0은 battery 선례를 가져온 [전제].
    note: "[실측] 기본값으로 변형 없이 파지 성공"
    grasp_fail_joint_rad: 0.5089
      # [전제] pet_labeled와 동일 형상으로 간주 -- 별도 실측 없음.
  plastic:
    # [9일차] v6 신규 클래스. 시연 물체는 흰색 불투명 컵 뚜껑이고,
    # 너무 가벼워 벨트 진동에 슬립이 나서 사용자가 **하부에 젠가
    # 3피스를 붙여뒀다** -- 즉 뚜껑이 젠가 두께만큼 떠 있다.
    force_n: 10
      # [실측 -- 9일차] 첫 성공 파지가 **너무 강해 뚜껑이 찌그러졌다**
      # (사용자 관찰). 당시 v5 배포라 pet_unlabeled 프로파일을 탔고
      # 그 force_n이 null(기본 40N)이었던 것이 원인. can과 동일한
      # 10N으로 맞춘다.
    close_wait_sec: 2.5
      # [실측 -- 9일차] 2.0에서 "그리퍼가 닫히면서 올라온다"
      # (사용자 육안). 닫기 명령이 비동기라 물리적으로 다
      # 닫히기 전에 상승이 시작되고 있었다. +0.5초.
    pre_close_width_mm: null
    pick_depth_mm: 115
      # [실측 -- 9일차] 110에서 3회 중 2회 실패(joint +0.7506/+0.7524,
      # 빈 손 +0.7496 수준). 사용자 육안 "5mm 더" -> 115.
      # [실측 -- 9일차] 108로 파지 성공했으나 사용자 지시로 110.
      # (100mm 기준 +10mm)
      # [실측 -- 9일차] 100mm로 시도했으나 파지 실패
      # (joint=+0.7387/+0.7542, 빈손 +0.7496 수준). 사용자 육안
      # 판단 "5~10mm 더 내려가야 한다" -> 중간값 108 적용.
    prediction_bias_mm: 40.0
      # [실측 -- 9일차] 30.0으로 파지 성공(joint +0.0470) 후 사용자
      # 지시로 +10 추가 -> 40.0.
      # [9일차, 사용자 육안] 컵 뚜껑 파지 2회 연속 실패. 깊이를
      # 108mm로 올린 뒤에도 "위치가 잘못 갔다", "배터리와 마찬가지로
      # 캠 상 오른쪽 보정 필요"(사용자). 카메라 오른쪽 = base X 증가
      # (픽셀 x 73->263 이 X 167.7->262.9 로 매핑됨)이므로 양수.
      # **주의: 예측 지연 보정이 아니라 공간 오프셋 보정이다.**
      # 실패 당시 물체는 정지 상태(kf_vx 0.1~0.3mm/s)라 예측이 더한
      # 거리가 사실상 0이었다. 필드 이름과 실제 용도가 다르므로
      # 나중에 정리할 것. 30.0은 battery 선례를 가져온 [전제].
    note: "[미실측] 첫 실파지로 pick_depth 확정 필요."
    grasp_fail_joint_rad: null
      # [미실측] 판정 제외. 잘못된 임계값을 넣으면 파지 성공을
      # 실패로 오탐해 통계를 오염시킨다(plastic_bag과 같은 처리).
      # plastic은 plastic_bin 직행이라 사람 안전과 무관하고 1단계는
      # 로그만이라 위험도가 낮다.
  plastic_bag:
    force_n: null
    close_wait_sec: 1.0
    pre_close_width_mm: null
    pick_depth_mm: 100   # [전제] 실측 없음, can/pet 기준값 사용
    note: "[실측 — 5일차] 기본값(40N)으로 파지 성공, 변형/손상 없음. review_bin까지 이동 성공"
    grasp_fail_joint_rad: null
      # [실측 -- 8일차] **판정 불가라 null.** 가장 두껍게 접은 상태가
      # +0.7141 rad로 실패값(+0.7496)과 0.0355rad 차이뿐이고(종이 재현
      # 편차 0.007의 5배), 사용자 확인상 이게 상한이라 실운용에선 더
      # 얇아져 실패값에 더 근접한다. 억지로 값을 넣으면 파지 성공을
      # 실패로 오탐해 성공률 통계를 오염시킨다. 어차피 review_bin행
      # (비전/무게 둘 다 판별 불가한 유일 품목)이라 위험도도 낮다.
