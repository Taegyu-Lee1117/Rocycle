# 품목 -> 처리 경로 매핑 (원칙3 외부화 — 판정 로직에 품목명 분기를
# 두지 않고 이 표를 조회해서 동작한다).
#
# bin_teach_points.py의 design_doc_bin_name과 일치해야 한다.
# `type: bin`이면 해당 bin으로 파지->배치. `type: human_handoff`면
# 아래 `handoff` 절 설정으로 실제 순응제어 핸드오버를 수행한다
# ([완료 — 6일차] `_handoff_item()`, task_compliance_ctrl 기반).

routing:
  can: {type: bin, bin: can_bin}
  paper: {type: bin, bin: paper_bin}
  battery: {type: bin, bin: battery_bin}
  pet_unlabeled: {type: bin, bin: plastic_bin}
  pet_labeled: {type: human_handoff}
  # [9일차] v6 모델 신규 클래스. 뚜껑/플라스틱 용기류.
  # pet_unlabeled는 지우지 않는다 -- v6가 그 클래스를 안 내도
  # 죽은 항목일 뿐 무해하고, v5로 롤백할 때 그대로 쓴다.
  plastic: {type: bin, bin: plastic_bin}
  plastic_bag: {type: bin, bin: review_bin}

place_open_wait_sec: 1.0   # [원문] 6일차 사이클 측정 스크립트에서 쓴 값

# 무게 측정으로 내용물 여부 판정 (원칙7 — 비전으로 못 보는 걸
# 힘으로 본다, v31 팀결정: can으로 무게측정 이동). 파지 직전(그리퍼
# 비어있음, 하강 전)과 파지 후(rise 완료)의 `get_workpiece_weight`
# 차이로 물체 무게를 구해 임계값 초과 시 review_bin으로 보낸다.
# **[실측 — 6일차, 구 속도 기준 검증 완료]** 절대값은 그리퍼 무게
# 오차로 빈 상태에서도 ~1.2~1.3kg으로 흔들리지만, 상대(파지전후
# 차이) 측정은 그램 단위로 정밀했다: 빈 캔 net=16.3g(threshold
# 미만 -> can_bin 정상), 실리카 샌드 채운 캔 net=86.9g(threshold
# 초과 -> review_bin 정상).
# **[실측, 재진단 — 6일차, 속도 상향 후]** 새 속도(travel 2.999s/
# descent 1.882s)에서 빈 캔이 반복적으로 review_bin 오배치됨
# (net 153.8g/125.3g). 처음엔 "정지 직후 settle 부족"으로 오진단
# 했으나, **벨트/로봇을 완전히 정지한 채로도 단일 측정이 45g 폭
# (1.310~1.355kg, 8회)으로 흔들림을 확인** -- 벨트 진동이 아니라
# 힘센서 자체의 고유 노이즈가 threshold(30g)와 비슷한 규모였던 것.
# 수정: baseline/post-pick 둘 다 `_get_workpiece_weight_avg()`로
# 교체(평균), baseline은 extra_gap 계산 이전으로 이동(타이밍 버그
# 수정, CLAUDE.md 참고).
# **[팀결정 — v52 회신] threshold 30g->80g 상향 + 시연용 내용물
# 무게를 현재(86.9g)의 약 2배(~175g)로 늘리는 것으로 잠정 결정.**
# 근거: 정지 상태 고립 드리프트 실험(±38g, CLAUDE.md 참고)만으로는
# 빈 캔(16.3g, 구 속도 기준)+드리프트(38g)=54g가 threshold(30g)를
# 넘어 구조적 오탐이 생긴다는 계산 -- 신호(내용물 무게)를 키워
# 드리프트를 압도하는 방향. **[전제, 미검증] 이 계산은 여러 버그
# 수정 이전 값(16.3g/86.9g)과 정지 상태 고립 드리프트(±38g)를
# 근거로 한 것인데, 실제 파지 사이클(다른 동작 뒤에 측정)에서는
# 이 세션 후반 net 값이 -87.9g~+153.8g로 훨씬 넓게 흔들린 사례가
# 있어 80g/175g이 최종값인지는 재검증(빈 캔 5회/내용물 캔 5회,
# 분포 확인) 전까지 확정 아님.**
weight_check:
  # ============================================================
  # [9일차 최종, v152] can과 pet_labeled를 **같은 값(0.20kg)**으로 둔다.
  # ============================================================
  # 두 임계값을 같게 두면 **소품이 어느 클래스로 오분류되든 결과가
  # 같아진다** -- 캔이 pet_labeled로 잡히든, 페트병이 can으로 잡히든
  # 무거우면 review_bin, 가벼우면 원래 경로다. 오늘 실물로 확인된
  # can<->pet_labeled 오분류(한 캔이 can 437프레임 / pet_labeled 411
  # 프레임으로 반반)가 결과를 바꾸지 못하게 만드는 설계다.
  #
  # 0.20kg 근거 -- 드리프트 최악 125g를 그대로 감수해도 갈린다:
  #   빈 캔       16 + 125 = 141g < 200   can_bin      (통과 여유 59g)
  #   빈 라벨병   25 + 125 = 150g < 200   사람 전달    (통과 여유 50g)
  #   샌드 캔    400 - 125 = 275g > 200   review_bin   (차단 여유 75g)
  #   물병 500ml 520 - 125 = 395g > 200   review_bin   (차단 여유 195g)
  #
  # **[운영 규칙 -- 반드시 지킬 것]**
  # 이 값이 안전한 것은 **시연 소품이 통제돼 있기 때문**이다.
  # net이 150~250g 구간에 들어오는 물체를 올리면 드리프트에 따라
  # 통과/차단이 갈려 예측할 수 없다. 특히 **내용물이 어중간하게 든
  # 캔(8일차 실측 net +235.1g)은 벨트에 올리지 말 것** -- 235-125=110g
  # 으로 통과해 사람에게 갈 수 있다.
  # 소품은 "비었거나(<50g) 확실히 무겁거나(>350g)" 둘 중 하나여야 한다.
  #
  # 9일차 중간에 pet_labeled를 0.13으로 잡았던 것은 그때 상정한
  # 무거운 소품이 235g짜리 캔이어서 200g으로는 못 걸렀기 때문이다.
  # 소품을 400g+로 바꾸면서 그 제약이 사라졌다.
  #
  # [한계] 드리프트 표본 9개(관측 -69.4 ~ +73.0g, can baseline 기준
  # 사이클간 최대 125g). 실제 분포 꼬리는 더 클 수 있다.
  # 근본 원인(로드셀 영점 드리프트) 조사는 시연 이후 과제.
  # [비활성화 -- 9일차, v146] `can` 항목을 껐다.
  #
  # 근거: baseline이 사이클마다 약 95~125g 드리프트해서 빈 캔(약 16g)
  # net이 -41.1 / +125.9 / -30.0 / +25.1g로 흩어진다(4회 중 1회만
  # 정상 범위). 드리프트 크기가 구별해야 할 신호(빈캔 16g vs 내용물캔
  # 235g)와 비슷한 규모라 **임계값을 어떻게 잡아도 오늘 밤 안에는
  # 둘을 못 가른다.** median-of-3은 같은 측정 내 단일 이상치만 잡지
  # 사이클간 통째 드리프트는 못 잡는다.
  #
  # **끄는 것이 안전한 이유**: `can`의 라우팅은 원래 `bin`행이라
  # 무게검사와 무관하게 can_bin으로 간다. 여기 weight_check는
  # "이상하게 무거운 캔을 review_bin으로 따로 빼는" 부가기능일 뿐
  # 사람에게 직행하는 경로가 아니다 -- **안전 게이트가 아니다.**
  # 진짜 안전 게이트(오분류된 무거운 물체가 사람에게 가는 것을 막는
  # 것)는 아래 `pet_labeled` 항목 + `_place_item`의 forced_bin 우선순위
  # 수정에 있고 그건 그대로 둔다.
  #
  # 근본 원인(로드셀 영점 드리프트 추정)은 시연 이후 조사 과제.
  # 되돌리려면 아래 세 줄의 주석을 해제하면 된다.
  can:
    threshold_kg: 0.20
    review_bin: review_bin
  # [9일차] 사람 인계 경로에도 무게 게이트를 켠다. 8일차에 드러난
  # 결함("내용물 든 캔이 pet_labeled로 오분류되면 무게 검사를 통째로
  # 건너뛰고 사람에게 간다")의 방어선이다. 오분류가 어느 쪽으로 나든
  # 결과가 같아진다 -- can으로 잡히면 위의 can 항목이, pet_labeled로
  # 잡히면 이 항목이 무거운 물체를 review_bin으로 보낸다.
  #
  # threshold 0.08kg 근거: 빈 라벨 페트병 약 30g(사용자 실측),
  # 내용물 든 캔 net +235.1g(8일차 #7 사이클). 그 사이를 가른다.
  # 빈 캔 net 16.3g / 실리카 채운 캔 86.9g(6일차)와도 일관.
  #
  # 주의: 이 항목을 켜면 pet_labeled 사이클에도 baseline 측정이
  # 들어간다. 측정 시간이 예측 구간(total_ahead)에 포함되므로
  # 파지 타이밍에 영향이 있다. 페트병 파지 정확도를 실물로 확인할 것.
  pet_labeled:
    threshold_kg: 0.20
    review_bin: review_bin

# 순응제어 기반 사람 핸드오버 (`_handoff_item()`, 6일차 구현).
# 새 x/y 좌표를 만들지 않고 `_execute_pick`이 이미 도달 검증한
# 벨트 상공 컬럼에서 z만 extra_rise_mm만큼 더 올려 제시 높이로
# 쓴다(안전 절 참고 — 새 자세 탐색 위험 회피). stiffness/
# release_threshold_mm은 CLAUDE.md 안전 절의 v25 예비 시행값
# (저강성 500, 잠정 release 임계값 10mm, TCP 변위 36.8mm까지
# SAFE_OFF 없음 확인)을 그대로 가져온 것 — 이 값 자체가 10회
# 연속 검증을 거친 것은 아직 아니다(과대 청구 금지).
#
# **[정정 — 8일차] 릴리즈 판정을 "누적 변위(총량)" 단독 조건에서
# "수평 속도 AND 누적 변위" 조합으로 바꿨다** — 총량만 보면 사람이
# 안 당겨도 저강성 진입 후 느린 처짐(크리프)이 몇 초에 걸쳐 누적돼
# release_threshold_mm을 넘어버린다(관제PC 실물 재현: 약 3초 만에
# 오탐 릴리즈, 라벨 페트병 낙하). 사람이 당기는 동작(빠름, 추정
# 20~50mm/s)과 중력 처짐(느림, 실측 평균 약 3.7mm/s)은 속도로 뚜렷이
# 갈린다는 판단. `pull_speed_mm_per_s`/`pull_speed_consecutive`는
# [전제, 미검증] — 실측 3.7mm/s와 추정 상한 사이 중간값으로 잡은
# 잠정치, 로봇 실물로 처짐/당김 두 조건의 속도 분포를 재본 뒤
# 조정할 것(`_handoff_item`의 매 폴링 로그로 확인 가능).
handoff:
  extra_rise_mm: 120.0
  stiffness: [500.0, 500.0, 500.0, 100.0, 100.0, 100.0]
  release_threshold_mm: 10.0
  pull_speed_mm_per_s: 3.0   # [정정 — 8일차, v87] 15.0 -> 3.0.
                             # 실측: 처짐 최대 1.0mm/s, 실제 당김 최소
                             # 6.2mm/s. 15.0은 당김 속도보다도 높아
                             # 인계 자체가 감지되지 않았다(2회차 실패).
  pull_speed_consecutive: 2
  timeout_sec: 15.0
  poll_interval_sec: 0.3
  compliance_transition_sec: 0.5


# [완료 — 8일차, v87] 품목·통별 배치 자세 오버라이드.
# rx/ry/rz 중 지정한 축만 덮어쓰고, 안 쓴 축은 파지 자세
# (motion_timing.yaml의 belt_hover_*)를 기본값으로 쓴다.
# x/y/z(통 위치)는 언제나 티치포인트 값 그대로다.
place_pose_override:
  # [9일차, v153] 490ml 캔이 review_bin 벽에 닿는 문제.
  # 무게 초과로 review_bin에 강제 배치될 때, 통 티치 자세
  # (rz=157.11)와 파지 자세(rz=89.78)가 67.33도 달라서 캔이
  # 통 가로폭에 대해 비스듬히 들어간다. 355ml 학습캔에서는
  # 길이가 짧아 문제가 없었는데 490ml(약 168mm)로 길어지며
  # 드러났다. 8일차에 라벨 페트병에서 같은 문제를 같은 방법
  # (파지 각도 그대로 진입)으로 해결했다.
  # can_bin 정상 경로는 이 문제가 없다 -- review_bin 조합에만 적용.
  can:
    review_bin:
      rz: 89.78   # 파지 자세(belt_hover_rz)와 동일 -- 회전 없이 진입
  pet_labeled:
    review_bin:
      rz: 89.78   # [전제, 미검증] 파지 자세(belt_hover_rz)와 동일값
        # -- 실물 투입 전 빈 그리퍼로 도달성/그리퍼-통벽 간섭
        # 확인 필수(이 좌표+자세 조합은 실행된 적 없음, 4일차
        # "상승 없이 이동하면 그리퍼가 통을 밀어버린" 사고 전례
        # 있는 구역, obstacles.yaml의 review_bin은 미실측 상태).
